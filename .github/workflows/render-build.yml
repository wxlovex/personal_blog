name: Verify Render image

on:
  push:
    branches: [codex/render-blog, main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build frontend and install browser tests
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Verify notes and profile recovery in the production build
        run: |
          mkdir -p target
          npm --prefix frontend run preview -- --host 127.0.0.1 --port 15173 --strictPort >target/frontend-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          curl --retry 30 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:15173/ >/dev/null
          python scripts/verify-review-regressions.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: personal_blog
          MYSQL_USER: blog
          MYSQL_PASSWORD: ci-only-blog-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend, run tests, and assemble runtime image
        run: docker build --tag personal-blog:verify .
      - name: Initialize disposable MySQL
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: docker exec -i "$MYSQL_CONTAINER" mysql -uroot -pci-only-root-password personal_blog < src/main/resources/db/schema.sql
      - name: Run packaged image against MySQL
        run: |
          docker run -d --name blog --network host \
            -e 'DB_URL=jdbc:mysql://127.0.0.1:3306/personal_blog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC' \
            -e DB_USERNAME=blog -e DB_PASSWORD=ci-only-blog-password \
            -e JWT_SECRET=ci-only-application-secret-at-least-32-bytes \
            --memory=512m personal-blog:verify
          curl --retry 30 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:8080/api/health
          curl --fail http://127.0.0.1:8080/login | grep 'id="app"'
          test "$(curl -s -o /tmp/private-response.json -w '%{http_code}' http://127.0.0.1:8080/api/article/list)" = 401
          curl --fail http://127.0.0.1:8080/api/plaza/articles
          curl --fail http://127.0.0.1:8080/api/user/security-options | grep '"mailEnabled":false'
      - name: Show runtime logs
        if: always()
        run: docker logs blog || true

  tidb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start disposable TiDB SQL engine
        run: |
          docker run -d --name tidb -p 127.0.0.1:4000:4000 -p 127.0.0.1:10080:10080 \
            pingcap/tidb:v8.5.1 --store=unistore --path= --host=0.0.0.0
          curl --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 --fail http://127.0.0.1:10080/status
          docker run --rm --network host --entrypoint mysql mysql:8.0 \
            -h127.0.0.1 -P4000 -uroot --ssl-mode=DISABLED \
            -e 'SET GLOBAL tidb_enable_check_constraint=ON; CREATE DATABASE blog_verification CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
      - name: Verify business transactions and database constraints on TiDB
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:4000/blog_verification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ''
        run: mvn -B -ntp verify
      - name: Show TiDB logs
        if: failure()
        run: docker logs --tail 100 tidb || true
