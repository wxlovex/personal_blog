# Source configuration for the existing bounce-club Web Service.
# When replacing its repository, use Docker and this health check in Render.
# Do not create a second service via Blueprint unless that is intended.
services:
  - type: web
    name: bounce-club
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_POOL_SIZE
        value: '5'
      - key: CORS_ALLOWED_ORIGINS
        value: ''
