spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:blog;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,COMMENT}
    username: ${TEST_DB_USERNAME:sa}
    password: ${TEST_DB_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

blog:
  jwt:
    secret: integration-test-only-secret-at-least-32-bytes
    ttl-seconds: 3600
  security:
    # Existing business suites create many accounts from one mock peer.
    # SecurityProtectionTests overrides these values to exercise actual limits.
    login-per-minute: 100000
    account-login-per-minute: 100000
    registration-per-hour: 100000
    writes-per-minute: 100000
    reads-per-minute: 100000
    require-verified-email-for-publication: false
