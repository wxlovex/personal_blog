server:
  port: ${PORT:8080}
  # Client-supplied proxy headers never define authentication/rate-limit identity.
  forward-headers-strategy: NONE
  tomcat:
    connection-timeout: 15s
    keep-alive-timeout: 30s

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLED:false}
      mail.smtp.ssl.checkserveridentity: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/personal_blog?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: 2000
      max-lifetime: 300000
      idle-timeout: 60000
  jackson:
    time-zone: UTC
  sql:
    init:
      mode: never
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

blog:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@example.invalid}
    public-base-url: ${MAIL_PUBLIC_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  security:
    max-request-bytes: ${MAX_REQUEST_BYTES:1048576}
    login-per-minute: ${LOGIN_PER_MINUTE:20}
    account-login-per-minute: ${ACCOUNT_LOGIN_PER_MINUTE:5}
    registration-per-hour: ${REGISTRATION_PER_HOUR:5}
    writes-per-minute: ${WRITES_PER_MINUTE:60}
    reads-per-minute: ${READS_PER_MINUTE:240}
    limiter-max-keys: ${LIMITER_MAX_KEYS:20000}
    registration-enabled: ${REGISTRATION_ENABLED:true}
    sensitive-per-minute: ${SENSITIVE_PER_MINUTE:5}
    email-per-hour: ${EMAIL_PER_HOUR:3}
    max-storage-bytes: ${MAX_STORAGE_BYTES:20971520}
    max-articles: ${MAX_ARTICLES:1000}
    max-comments: ${MAX_COMMENTS:10000}
    max-categories: ${MAX_CATEGORIES:200}
    require-verified-email-for-publication: ${REQUIRE_VERIFIED_EMAIL_FOR_PUBLICATION:false}
